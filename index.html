<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0a" />
<meta name="author" content="ashfak arya" />
<title>ProCut Studio — by ashfak arya</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0a0a0a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
  ::-webkit-scrollbar-track { background: transparent; }
  input[type=range] { -webkit-appearance: none; appearance: none; height: 4px; background: #333; border-radius: 2px; outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: #fff; border-radius: 50%; cursor: pointer; }
  .tool-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 8px 4px; min-width: 64px; color: #aaa; font-size: 11px; transition: color 0.15s; }
  .tool-btn.active { color: #fff; }
  .tool-btn .icon { font-size: 22px; }
  .clip { position: absolute; top: 2px; bottom: 2px; border-radius: 4px; overflow: hidden; cursor: grab; transition: box-shadow 0.15s; }
  .clip.selected { box-shadow: 0 0 0 2px #fff, 0 0 0 4px rgba(255,255,255,0.3); z-index: 10; }
  .clip:active { cursor: grabbing; }
  .clip .handle { position: absolute; top: 0; bottom: 0; width: 10px; cursor: ew-resize; background: rgba(255,255,255,0.3); opacity: 0; transition: opacity 0.15s; }
  .clip:hover .handle, .clip.selected .handle { opacity: 1; }
  .clip .handle.left { left: 0; border-radius: 4px 0 0 4px; }
  .clip .handle.right { right: 0; border-radius: 0 4px 4px 0; }
  .panel { position: absolute; left: 0; right: 0; bottom: 0; background: #1a1a1a; border-top: 1px solid #2a2a2a; transform: translateY(100%); transition: transform 0.25s ease-out; z-index: 50; max-height: 60vh; overflow-y: auto; }
  .panel.open { transform: translateY(0); }
  .tab-btn { padding: 8px 14px; font-size: 13px; color: #888; white-space: nowrap; border-bottom: 2px solid transparent; }
  .tab-btn.active { color: #fff; border-bottom-color: #fff; }
  .slider-row { display: flex; align-items: center; gap: 10px; padding: 10px 16px; }
  .slider-row label { font-size: 12px; color: #aaa; min-width: 80px; }
  .slider-row input[type=range] { flex: 1; }
  .slider-row .val { font-size: 12px; color: #fff; min-width: 40px; text-align: right; }
  .color-swatch { width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
  .color-swatch.selected { border-color: #fff; }
  .playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; pointer-events: none; z-index: 20; }
  .playhead::before { content: ''; position: absolute; top: -2px; left: -5px; width: 12px; height: 12px; background: #fff; clip-path: polygon(50% 100%, 0 0, 100% 0); }
  .ruler-tick { position: absolute; top: 0; bottom: 0; border-left: 1px solid #333; font-size: 9px; color: #666; padding-left: 3px; }
  .sticker-item { font-size: 36px; padding: 8px; cursor: pointer; text-align: center; border-radius: 8px; transition: background 0.15s; }
  .sticker-item:hover, .sticker-item:active { background: #2a2a2a; }
  .filter-item { width: 72px; flex-shrink: 0; cursor: pointer; text-align: center; }
  .filter-item .preview { width: 72px; height: 72px; border-radius: 8px; background: linear-gradient(135deg, #667eea, #764ba2); margin-bottom: 4px; border: 2px solid transparent; }
  .filter-item.selected .preview { border-color: #fff; }
  .filter-item .name { font-size: 11px; color: #aaa; }
  .filter-item.selected .name { color: #fff; }
  .template-card { aspect-ratio: 16/9; background: #222; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 2px solid transparent; transition: all 0.15s; }
  .template-card:hover, .template-card.selected { border-color: #fff; }
  .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 13px; z-index: 1000; animation: slideDown 0.3s ease-out; }
  @keyframes slideDown { from { opacity: 0; transform: translate(-50%, -20px); } to { opacity: 1; transform: translate(-50%, 0); } }
  .preview-canvas { background: #000; display: block; }
  .btn-primary { background: #fff; color: #000; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; }
  .btn-secondary { background: #2a2a2a; color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 13px; }
  .btn-danger { background: #ef4444; color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 13px; }
  select, input[type=text], input[type=number], textarea { background: #2a2a2a; color: #fff; border: 1px solid #3a3a3a; border-radius: 6px; padding: 8px 10px; font-size: 13px; outline: none; width: 100%; }
  select:focus, input:focus, textarea:focus { border-color: #fff; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal { background: #1a1a1a; border-radius: 12px; max-width: 500px; width: 100%; max-height: 80vh; overflow-y: auto; }
  .modal-header { padding: 16px; border-bottom: 1px solid #2a2a2a; display: flex; justify-content: space-between; align-items: center; }
  .modal-body { padding: 16px; }
  .modal-footer { padding: 16px; border-top: 1px solid #2a2a2a; display: flex; gap: 8px; justify-content: flex-end; }
  .keyframe-dot { position: absolute; top: 50%; width: 10px; height: 10px; background: #fbbf24; transform: translate(-50%, -50%) rotate(45deg); cursor: pointer; z-index: 5; }
  @media (min-width: 768px) {
    .desktop-layout { display: grid; grid-template-columns: 280px 1fr 300px; grid-template-rows: 1fr 280px; height: 100vh; }
    .desktop-layout .top-bar { grid-column: 1 / -1; }
    .desktop-layout .media-panel { grid-row: 2; overflow-y: auto; }
    .desktop-layout .preview-area { grid-column: 2; grid-row: 2; }
    .desktop-layout .props-panel { grid-column: 3; grid-row: 2 / 4; overflow-y: auto; }
    .desktop-layout .timeline-area { grid-column: 2; grid-row: 3; }
  }
</style>
</head>
<body>

<div id="app"></div>

<script>
// ============================================================
// ProCut Studio - Single File Video Editor
// Developer: ashfak arya
// ============================================================

// ---------- STATE ----------
const state = {
  view: 'home',
  project: null,
  activeTool: null,
  selectedClipId: null,
  isPlaying: false,
  playhead: 0,
  zoom: 50,
  dragState: null,
  history: [],
  historyIndex: -1,
  assetElements: new Map(),
  audioElements: new Map(),
  renderVersion: 0,
  toast: null,
  modal: null,
};

// ---------- UTILS ----------
const uid = () => Math.random().toString(36).slice(2, 11);
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
const formatTime = (s) => {
  if (s < 0) s = 0;
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  const ms = Math.floor((s - Math.floor(s)) * 100);
  return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}.${String(ms).padStart(2,'0')}`;
};

function toast(msg) {
  state.toast = msg;
  render();
  setTimeout(() => { state.toast = null; render(); }, 2000);
}

// ---------- PROJECT MODEL ----------
function createProject(name = 'Untitled') {
  return {
    id: uid(),
    name,
    developer: 'ashfak arya',
    createdAt: Date.now(),
    updatedAt: Date.now(),
    width: 1080,
    height: 1920,
    fps: 30,
    assets: [],
    tracks: [
      { id: uid(), type: 'text', name: 'Text', order: 0, locked: false, hidden: false, muted: false },
      { id: uid(), type: 'video', name: 'Video 1', order: 1, locked: false, hidden: false, muted: false },
      { id: uid(), type: 'video', name: 'Video 2', order: 2, locked: false, hidden: false, muted: false },
      { id: uid(), type: 'audio', name: 'Audio', order: 3, locked: false, hidden: false, muted: false },
    ],
    clips: [],
    playhead: 0,
  };
}

function createClip(overrides = {}) {
  return {
    id: uid(),
    assetId: null,
    trackId: '',
    type: 'video',
    start: 0,
    inPoint: 0,
    outPoint: 5,
    x: 0, y: 0, scale: 1, rotation: 0, opacity: 1,
    volume: 1,
    speed: 1,
    reversed: false,
    muted: false,
    filters: { brightness: 100, contrast: 100, saturation: 100, hue: 0, blur: 0, temp: 0 },
    text: '', fontSize: 64, fontFamily: 'sans-serif', color: '#ffffff', bgColor: '', textAlign: 'center',
    sticker: '',
    crop: { l: 0, r: 0, t: 0, b: 0 },
    keyframes: {},
    blendMode: 'normal',
    ...overrides,
  };
}

// ---------- PERSISTENCE ----------
function saveProject() {
  if (!state.project) return;
  const data = JSON.parse(JSON.stringify(state.project));
  data.assets = data.assets.map(a => ({ ...a, url: '', thumbnail: '' }));
  localStorage.setItem('procuts_projects', JSON.stringify(getAllProjects().filter(p => p.id !== data.id).concat(data)));
  toast('Project saved ✓');
}

function getAllProjects() {
  try { return JSON.parse(localStorage.getItem('procuts_projects') || '[]'); }
  catch { return []; }
}

function loadProject(id) {
  const all = getAllProjects();
  const p = all.find(x => x.id === id);
  if (p) {
    state.project = p;
    state.view = 'editor';
    state.playhead = 0;
    state.selectedClipId = null;
    state.activeTool = null;
    pushHistory();
    render();
  }
}

function deleteProject(id) {
  const all = getAllProjects().filter(p => p.id !== id);
  localStorage.setItem('procuts_projects', JSON.stringify(all));
  render();
}

// ---------- HISTORY (Undo/Redo) ----------
function pushHistory() {
  if (!state.project) return;
  state.history = state.history.slice(0, state.historyIndex + 1);
  state.history.push(JSON.stringify(state.project));
  if (state.history.length > 50) state.history.shift();
  state.historyIndex = state.history.length - 1;
}

function undo() {
  if (state.historyIndex <= 0) return;
  state.historyIndex--;
  state.project = JSON.parse(state.history[state.historyIndex]);
  state.renderVersion++;
  render();
  toast('Undo');
}

function redo() {
  if (state.historyIndex >= state.history.length - 1) return;
  state.historyIndex++;
  state.project = JSON.parse(state.history[state.historyIndex]);
  state.renderVersion++;
  render();
  toast('Redo');
}

// ---------- UPDATE PROJECT ----------
function updateProject(mutator) {
  if (!state.project) return;
  mutator(state.project);
  state.project.updatedAt = Date.now();
  state.renderVersion++;
  pushHistory();
  render();
}

// ---------- ASSET MANAGEMENT ----------
async function importFiles(files) {
  if (!state.project) return;
  for (const file of files) {
    const url = URL.createObjectURL(file);
    const type = file.type.startsWith('video') ? 'video' : file.type.startsWith('audio') ? 'audio' : file.type.includes('gif') ? 'gif' : 'image';
    const asset = {
      id: uid(), type, name: file.name, url, duration: 0, width: 0, height: 0, thumbnail: '', size: file.size, mime: file.type,
    };
    if (type === 'video' || type === 'audio') {
      const el = document.createElement(type === 'video' ? 'video' : 'audio');
      el.preload = 'metadata'; el.muted = true; el.src = url;
      await new Promise(r => { el.onloadedmetadata = r; el.onerror = r; });
      asset.duration = el.duration || 5;
      if (type === 'video') {
        asset.width = el.videoWidth; asset.height = el.videoHeight;
        try {
          el.currentTime = Math.min(1, asset.duration / 4);
          await new Promise(r => { el.onseeked = r; setTimeout(r, 500); });
          const c = document.createElement('canvas');
          c.width = 160; c.height = 160 * (asset.height / asset.width);
          c.getContext('2d').drawImage(el, 0, 0, c.width, c.height);
          asset.thumbnail = c.toDataURL('image/jpeg', 0.7);
        } catch {}
      }
    } else {
      const img = new Image(); img.src = url;
      await new Promise(r => { img.onload = r; img.onerror = r; });
      asset.width = img.width; asset.height = img.height;
      asset.duration = 5;
      const c = document.createElement('canvas');
      c.width = 160; c.height = 160 * (asset.height / asset.width);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      asset.thumbnail = c.toDataURL('image/jpeg', 0.7);
    }
    state.project.assets.push(asset);
  }
  state.renderVersion++;
  render();
  toast(`${files.length} file(s) imported`);
}

function addClipFromAsset(assetId) {
  const asset = state.project.assets.find(a => a.id === assetId);
  if (!asset) return;
  const trackType = asset.type === 'audio' ? 'audio' : 'video';
  const track = state.project.tracks.find(t => t.type === trackType && !t.locked);
  if (!track) { toast('No available track'); return; }
  const end = state.project.clips.filter(c => c.trackId === track.id).reduce((m, c) => Math.max(m, c.start + clipDuration(c)), 0);
  const clip = createClip({
    assetId, trackId: track.id, type: asset.type === 'audio' ? 'audio' : asset.type === 'image' ? 'image' : 'video',
    start: Math.max(state.playhead, end), inPoint: 0, outPoint: asset.duration,
  });
  updateProject(p => p.clips.push(clip));
  state.selectedClipId = clip.id;
  render();
}

function clipDuration(c) { return (c.outPoint - c.inPoint) / Math.abs(c.speed || 1); }
function clipEnd(c) { return c.start + clipDuration(c); }

// ---------- CLIP OPERATIONS ----------
function splitAllAtPlayhead() {
  const time = state.playhead;
  const toSplit = state.project.clips.filter(c => time > c.start && time < clipEnd(c));
  if (toSplit.length === 0) { toast('Nothing to split'); return; }
  updateProject(p => {
    toSplit.forEach(c => {
      const splitSrc = c.inPoint + (time - c.start) * Math.abs(c.speed);
      const newClip = JSON.parse(JSON.stringify(c));
      newClip.id = uid();
      newClip.inPoint = splitSrc;
      newClip.start = time;
      c.outPoint = splitSrc;
      p.clips.push(newClip);
    });
  });
  toast(`Split ${toSplit.length} clip(s)`);
}

function deleteSelected() {
  if (!state.selectedClipId) return;
  updateProject(p => { p.clips = p.clips.filter(c => c.id !== state.selectedClipId); });
  state.selectedClipId = null;
  render();
  toast('Deleted');
}

function duplicateSelected() {
  const c = state.project.clips.find(x => x.id === state.selectedClipId);
  if (!c) return;
  const copy = JSON.parse(JSON.stringify(c));
  copy.id = uid();
  copy.start = clipEnd(c);
  updateProject(p => p.clips.push(copy));
  state.selectedClipId = copy.id;
  render();
  toast('Duplicated');
}

// ---------- CANVAS PREVIEW ----------
function getAssetElement(asset) {
  if (state.assetElements.has(asset.id)) return state.assetElements.get(asset.id);
  let el;
  if (asset.type === 'video') {
    el = document.createElement('video');
    el.src = asset.url; el.muted = true; el.playsInline = true; el.preload = 'auto';
    el.crossOrigin = 'anonymous';
  } else {
    el = new Image(); el.src = asset.url;
  }
  state.assetElements.set(asset.id, el);
  return el;
}

function applyFilterString(f) {
  const parts = [];
  if (f.brightness !== 100) parts.push(`brightness(${f.brightness}%)`);
  if (f.contrast !== 100) parts.push(`contrast(${f.contrast}%)`);
  if (f.saturation !== 100) parts.push(`saturate(${f.saturation}%)`);
  if (f.hue) parts.push(`hue-rotate(${f.hue}deg)`);
  if (f.blur > 0) parts.push(`blur(${f.blur}px)`);
  return parts.length ? parts.join(' ') : 'none';
}

function evaluateKeyframes(kfs, fallback, time) {
  if (!kfs || kfs.length === 0) return fallback;
  const sorted = [...kfs].sort((a, b) => a.time - b.time);
  if (time <= sorted[0].time) return sorted[0].value;
  if (time >= sorted[sorted.length - 1].time) return sorted[sorted.length - 1].value;
  let i = 0;
  while (i < sorted.length - 1 && sorted[i + 1].time < time) i++;
  const a = sorted[i], b = sorted[i + 1];
  const t = (time - a.time) / (b.time - a.time);
  return a.value + (b.value - a.value) * t;
}

function renderPreview(canvas, includeWatermark = false) {
  if (!state.project) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const p = state.project;
  const time = state.playhead;

  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  const tracksSorted = [...p.tracks].sort((a, b) => a.order - b.order);
  const trackIdx = new Map(tracksSorted.map((t, i) => [t.id, i]));

  const visibleClips = p.clips.filter(c => {
    const end = clipEnd(c);
    return time >= c.start && time < end;
  }).sort((a, b) => (trackIdx.get(a.trackId) || 0) - (trackIdx.get(b.trackId) || 0));

  for (const clip of visibleClips) {
    const track = p.tracks.find(t => t.id === clip.trackId);
    if (track?.hidden) continue;

    ctx.save();

    const x = evaluateKeyframes(clip.keyframes?.x, clip.x, time);
    const y = evaluateKeyframes(clip.keyframes?.y, clip.y, time);
    const scale = evaluateKeyframes(clip.keyframes?.scale, clip.scale, time);
    const rotation = evaluateKeyframes(clip.keyframes?.rotation, clip.rotation, time);
    const opacity = evaluateKeyframes(clip.keyframes?.opacity, clip.opacity, time);
    ctx.globalAlpha = opacity;

    const cx = W / 2 + x;
    const cy = H / 2 + y;
    ctx.translate(cx, cy);
    ctx.rotate(rotation * Math.PI / 180);
    ctx.scale(scale, scale);
    ctx.translate(-W / 2, -H / 2);

    if (clip.type === 'text') {
      drawTextClip(ctx, clip, W, H);
    } else if (clip.type === 'sticker') {
      ctx.font = `${clip.fontSize || 120}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(clip.sticker || '😀', W / 2, H / 2);
    } else if (clip.assetId) {
      const asset = p.assets.find(a => a.id === clip.assetId);
      if (asset) {
        const el = getAssetElement(asset);
        if (el) {
          ctx.filter = applyFilterString(clip.filters);
          const srcW = asset.width || (el.videoWidth || el.width || W);
          const srcH = asset.height || (el.videoHeight || el.height || H);

          if (el.tagName === 'VIDEO') {
            const localTime = time - clip.start;
            const srcTime = clip.inPoint + localTime * clip.speed;
            try {
              if (Math.abs(el.currentTime - srcTime) > 0.1) {
                el.currentTime = clamp(srcTime, 0, el.duration || 0);
              }
            } catch {}
          }

          const canvasAspect = W / H;
          const srcAspect = srcW / srcH;
          let dw, dh, dx, dy;
          if (srcAspect > canvasAspect) {
            dh = H; dw = H * srcAspect;
          } else {
            dw = W; dh = W / srcAspect;
          }
          dx = (W - dw) / 2;
          dy = (H - dh) / 2;

          const cr = clip.crop;
          const sx = (cr?.l || 0) * srcW;
          const sy = (cr?.t || 0) * srcH;
          const sw = srcW * (1 - (cr?.l || 0) - (cr?.r || 0));
          const sh = srcH * (1 - (cr?.t || 0) - (cr?.b || 0));

          try {
            ctx.drawImage(el, sx, sy, sw, sh, dx, dy, dw, dh);
          } catch {}
          ctx.filter = 'none';
        }
      }
    }

    ctx.restore();
  }

  // Developer credit watermark on exported video
  if (includeWatermark) {
    ctx.save();
    ctx.font = 'bold 24px sans-serif';
    ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'bottom';
    ctx.fillText('Created with ProCut Studio • Dev: ashfak arya', W - 24, H - 24);
    ctx.restore();
  }
}

function drawTextClip(ctx, clip, W, H) {
  const text = clip.text || '';
  if (!text) return;
  const fontSize = clip.fontSize || 64;
  ctx.font = `bold ${fontSize}px ${clip.fontFamily || 'sans-serif'}`;
  ctx.textAlign = clip.textAlign || 'center';
  ctx.textBaseline = 'middle';

  const x = clip.textAlign === 'left' ? 40 : clip.textAlign === 'right' ? W - 40 : W / 2;
  const y = H / 2 + (clip.y || 0);

  if (clip.bgColor) {
    const metrics = ctx.measureText(text);
    const pad = 20;
    const w = metrics.width + pad * 2;
    const h = fontSize + pad * 2;
    ctx.fillStyle = clip.bgColor;
    const bx = clip.textAlign === 'left' ? 20 : clip.textAlign === 'right' ? W - 20 - w : W / 2 - w / 2;
    ctx.fillRect(bx, y - h / 2, w, h);
  }

  ctx.strokeStyle = 'rgba(0,0,0,0.8)';
  ctx.lineWidth = Math.max(2, fontSize / 20);
  ctx.strokeText(text, x, y);
  ctx.fillStyle = clip.color || '#fff';
  ctx.fillText(text, x, y);
}

// ---------- AUDIO ENGINE ----------
let audioCtx = null;
let audioSources = new Map();

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function stopAllAudio() {
  audioSources.forEach(s => {
    try { s.element.pause(); s.source.disconnect(); s.gain.disconnect(); } catch {}
  });
  audioSources.clear();
}

async function playAudioFrom(time) {
  if (!state.project) return;
  initAudio();
  stopAllAudio();
  const master = audioCtx.createGain();
  master.connect(audioCtx.destination);

  const clips = state.project.clips.filter(c =>
    (c.type === 'audio' || (c.type === 'video' && !c.muted)) && clipEnd(c) > time
  );

  for (const clip of clips) {
    const asset = state.project.assets.find(a => a.id === clip.assetId);
    if (!asset || asset.type === 'image') continue;
    let el = state.audioElements.get(asset.id);
    if (!el) {
      el = new Audio();
      el.src = asset.url;
      el.crossOrigin = 'anonymous';
      state.audioElements.set(asset.id, el);
    }
    const localTime = time - clip.start;
    const srcTime = clip.inPoint + Math.max(0, localTime) * clip.speed;
    el.currentTime = clamp(srcTime, 0, el.duration || 0);
    el.playbackRate = clip.speed;
    el.volume = clip.volume;
    el.muted = clip.muted;
    try {
      const source = audioCtx.createMediaElementSource(el);
      const gain = audioCtx.createGain();
      gain.gain.value = 1;
      source.connect(gain).connect(master);
      audioSources.set(clip.id, { source, gain, element: el });
      await el.play().catch(() => {});
      const remaining = clipEnd(clip) - time;
      setTimeout(() => { try { el.pause(); } catch {} }, remaining * 1000);
    } catch (e) { console.warn(e); }
  }
}

// ---------- EXPORT ----------
async function exportVideo() {
  if (!state.project) return;
  const p = state.project;
  const duration = Math.max(1, p.clips.reduce((m, c) => Math.max(m, clipEnd(c)), 0));
  if (duration < 0.1) { toast('Nothing to export'); return; }

  toast('Starting export...');

  const canvas = document.createElement('canvas');
  canvas.width = p.width;
  canvas.height = p.height;

  const stream = canvas.captureStream(p.fps);

  const audioCtxExport = new AudioContext();
  const dest = audioCtxExport.createMediaStreamDestination();
  const audioClips = p.clips.filter(c => c.type === 'audio' || (c.type === 'video' && !c.muted));
  const audioEls = [];
  for (const clip of audioClips) {
    const asset = p.assets.find(a => a.id === clip.assetId);
    if (!asset || asset.type === 'image') continue;
    const el = new Audio();
    el.src = asset.url;
    el.currentTime = clip.inPoint;
    el.volume = clip.volume;
    el.muted = clip.muted;
    audioEls.push(el);
    try {
      const src = audioCtxExport.createMediaElementSource(el);
      src.connect(dest);
    } catch {}
  }
  dest.stream.getAudioTracks().forEach(t => stream.addTrack(t));

  const recorder = new MediaRecorder(stream, {
    mimeType: 'video/webm;codecs=vp9,opus',
    videoBitsPerSecond: 8_000_000,
  });
  const chunks = [];
  recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
  const donePromise = new Promise(r => { recorder.onstop = () => r(new Blob(chunks, { type: 'video/webm' })); });

  recorder.start();

  for (const el of audioEls) {
    el.currentTime = 0;
    await el.play().catch(() => {});
  }

  const fps = p.fps;
  const totalFrames = Math.ceil(duration * fps);
  const startMs = performance.now();

  for (let frame = 0; frame < totalFrames; frame++) {
    const t = frame / fps;
    state.playhead = t;
    renderPreview(canvas, true);
    if (frame % 10 === 0) toast(`Rendering ${Math.round(t / duration * 100)}%`);
    const targetMs = startMs + (frame + 1) * (1000 / fps);
    const wait = targetMs - performance.now();
    if (wait > 0) await new Promise(r => setTimeout(r, wait));
  }

  audioEls.forEach(el => el.pause());
  audioCtxExport.close();
  recorder.stop();
  stream.getTracks().forEach(t => t.stop());

  const blob = await donePromise;
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${p.name.replace(/[^a-z0-9]/gi, '_')}_ashfak_arya.webm`;
  a.click();
  URL.revokeObjectURL(url);
  toast('Export complete ✓');
}

function attachTimelineEvents() {
  const ruler = document.getElementById('ruler');
  const scroll = document.getElementById('timeline-scroll');

  if (ruler) {
    const seek = (e) => {
      const rect = ruler.getBoundingClientRect();
      const scrollLeft = scroll.scrollLeft;
      const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left + scrollLeft;
      state.playhead = clamp(x / state.zoom, 0, 1000);
      render();
    };
    ruler.addEventListener('mousedown', seek);
    ruler.addEventListener('touchstart', seek);
  }

  document.querySelectorAll('[data-clip]').forEach(el => {
    const clipId = el.dataset.clip;
    el.addEventListener('click', (e) => {
      if (e.target.dataset.handle) return;
      state.selectedClipId = clipId;
      render();
    });

    let dragStart = null;
    const startDrag = (e) => {
      if (e.target.dataset.handle) return;
      e.preventDefault();
      const clip = state.project.clips.find(c => c.id === clipId);
      if (!clip) return;
      dragStart = {
        clipId,
        startX: e.touches ? e.touches[0].clientX : e.clientX,
        originalStart: clip.start,
      };
      state.selectedClipId = clipId;
    };

    const onDrag = (e) => {
      if (!dragStart) return;
      const x = e.touches ? e.touches[0].clientX : e.clientX;
      const dt = (x - dragStart.startX) / state.zoom;
      const clip = state.project.clips.find(c => c.id === dragStart.clipId);
      if (clip) {
        clip.start = clamp(dragStart.originalStart + dt, 0, 1000);
        render();
      }
    };

    const endDrag = () => {
      if (dragStart) { pushHistory(); dragStart = null; }
    };

    el.addEventListener('mousedown', startDrag);
    el.addEventListener('touchstart', startDrag);
    window.addEventListener('mousemove', onDrag);
    window.addEventListener('touchmove', onDrag);
    window.addEventListener('mouseup', endDrag);
    window.addEventListener('touchend', endDrag);
  });
}

function attachPanelEvents() {
  document.querySelectorAll('[data-close-panel]').forEach(el => {
    el.addEventListener('click', () => { state.activeTool = null; render(); });
  });
  document.querySelectorAll('[data-close-modal]').forEach(el => {
    el.addEventListener('click', () => { state.modal = null; render(); });
  });

  document.getElementById('btn-import-media')?.addEventListener('click', () => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'video/*,image/*,audio/*,.gif';
    input.multiple = true;
    input.onchange = (e) => importFiles(e.target.files);
    input.click();
  });
  document.getElementById('btn-split-playhead')?.addEventListener('click', splitAllAtPlayhead);
  document.getElementById('btn-dup-clip')?.addEventListener('click', duplicateSelected);
  document.getElementById('btn-del-clip')?.addEventListener('click', deleteSelected);
  document.getElementById('btn-mute')?.addEventListener('click', () => {
    const c = state.project.clips.find(x => x.id === state.selectedClipId);
    if (!c) return;
    updateProject(p => { const cl = p.clips.find(x => x.id === c.id); if (cl) cl.muted = !cl.muted; });
  });
  document.getElementById('btn-flip')?.addEventListener('click', () => {
    const c = state.project.clips.find(x => x.id === state.selectedClipId);
    if (!c) return;
    updateProject(p => { const cl = p.clips.find(x => x.id === c.id); if (cl) cl.scale = -cl.scale; });
  });

  document.querySelectorAll('[data-add-asset]').forEach(el => {
    el.addEventListener('click', () => addClipFromAsset(el.dataset.addAsset));
  });

  document.querySelectorAll('[data-prop]').forEach(el => {
    el.addEventListener('input', (e) => {
      const c = state.project.clips.find(x => x.id === state.selectedClipId);
      if (!c) return;
      c[el.dataset.prop] = parseFloat(e.target.value);
      render();
    });
    el.addEventListener('change', () => pushHistory());
  });
  document.querySelector('[data-toggle-mute]')?.addEventListener('click', () => {
    const c = state.project.clips.find(x => x.id === state.selectedClipId);
    if (!c) return;
    updateProject(p => { const cl = p.clips.find(x => x.id === c.id); if (cl) cl.muted = !cl.muted; });
  });

  document.getElementById('btn-add-text')?.addEventListener('click', () => {
    const track = state.project.tracks.find(t => t.type === 'text');
    if (!track) return;
    const end = state.project.clips.filter(c => c.trackId === track.id).reduce((m, c) => Math.max(m, clipEnd(c)), 0);
    const clip = createClip({
      trackId: track.id, type: 'text',
      start: Math.max(state.playhead, end), inPoint: 0, outPoint: 5,
      text: 'Your text here', fontSize: 64, color: '#ffffff',
    });
    updateProject(p => p.clips.push(clip));
    state.selectedClipId = clip.id;
    render();
  });
  document.querySelectorAll('[data-text-prop]').forEach(el => {
    const prop = el.dataset.textProp;
    el.addEventListener('input', (e) => {
      const c = state.project.clips.find(x => x.id === state.selectedClipId);
      if (!c || c.type !== 'text') return;
      c[prop] = el.type === 'range' || el.type === 'number' ? parseFloat(e.target.value) : e.target.value;
      render();
    });
    el.addEventListener('change', () => pushHistory());
  });
  document.querySelectorAll('[data-text-color]').forEach(el => {
    el.addEventListener('click', () => {
      const c = state.project.clips.find(x => x.id === state.selectedClipId);
      if (!c) return;
      updateProject(p => { const cl = p.clips.find(x => x.id === c.id); if (cl) cl.color = el.dataset.textColor; });
    });
  });
  document.querySelectorAll('[data-text-bg]').forEach(el => {
    el.addEventListener('click', () => {
      const c = state.project.clips.find(x => x.id === state.selectedClipId);
      if (!c) return;
      updateProject(p => { const cl = p.clips.find(x => x.id === c.id); if (cl) cl.bgColor = el.dataset.textBg; });
    });
  });

  document.querySelectorAll('[data-sticker]').forEach(el => {
    el.addEventListener('click', () => {
      const track = state.project.tracks.find(t => t.type === 'text');
      if (!track) return;
      const end = state.project.clips.filter(c => c.trackId === track.id).reduce((m, c) => Math.max(m, clipEnd(c)), 0);
      const clip = createClip({
        trackId: track.id, type: 'sticker',
        start: Math.max(state.playhead, end), inPoint: 0, outPoint: 3,
        sticker: el.dataset.sticker, fontSize: 120,
      });
      updateProject(p => p.clips.push(clip));
      state.selectedClipId = clip.id;
      toast('Sticker added');
    });
  });

  document.querySelectorAll('[data-filter]').forEach(el => {
    el.addEventListener('click', () => {
      const c = state.project.clips.find(x => x.id === state.selectedClipId);
      if (!c) return;
      const preset = FILTER_PRESETS[parseInt(el.dataset.filter)];
      updateProject(p => { const cl = p.clips.find(x => x.id === c.id); if (cl) cl.filters = { ...preset.f }; });
    });
  });
  document.querySelectorAll('[data-filter-prop]').forEach(el => {
    el.addEventListener('input', (e) => {
      const c = state.project.clips.find(x => x.id === state.selectedClipId);
      if (!c) return;
      c.filters[el.dataset.filterProp] = parseFloat(e.target.value);
      render();
    });
    el.addEventListener('change', () => pushHistory());
  });

  document.querySelectorAll('[data-effect]').forEach(el => {
    el.addEventListener('click', () => {
      const c = state.project.clips.find(x => x.id === state.selectedClipId);
      if (!c) return;
      const preset = EFFECT_PRESETS[parseInt(el.dataset.effect)];
      updateProject(p => {
        const cl = p.clips.find(x => x.id === c.id);
        if (cl) preset.apply(cl);
      });
      toast(`${preset.name} applied`);
    });
  });
  document.querySelectorAll('[data-clip-prop]').forEach(el => {
    const prop = el.dataset.clipProp;
    el.addEventListener('input', (e) => {
      const c = state.project.clips.find(x => x.id === state.selectedClipId);
      if (!c) return;
      c[prop] = el.type === 'range' || el.type === 'number' ? parseFloat(e.target.value) : e.target.value;
      render();
    });
    el.addEventListener('change', () => pushHistory());
  });

  document.querySelectorAll('[data-speed]').forEach(el => {
    el.addEventListener('click', () => {
      const c = state.project.clips.find(x => x.id === state.selectedClipId);
      if (!c) return;
      updateProject(p => { const cl = p.clips.find(x => x.id === c.id); if (cl) cl.speed = parseFloat(el.dataset.speed); });
    });
  });

  document.querySelectorAll('[data-crop]').forEach(el => {
    el.addEventListener('input', (e) => {
      const c = state.project.clips.find(x => x.id === state.selectedClipId);
      if (!c) return;
      c.crop = c.crop || { l: 0, r: 0, t: 0, b: 0 };
      c.crop[el.dataset.crop] = parseFloat(e.target.value);
      render();
    });
    el.addEventListener('change', () => pushHistory());
  });
  document.querySelectorAll('[data-rotate]').forEach(el => {
    el.addEventListener('click', () => {
      const c = state.project.clips.find(x => x.id === state.selectedClipId);
      if (!c) return;
      const deg = parseInt(el.dataset.rotate);
      updateProject(p => { const cl = p.clips.find(x => x.id === c.id); if (cl) cl.rotation = deg === 0 ? 0 : cl.rotation + deg; });
    });
  });

  document.querySelectorAll('[data-kf-toggle]').forEach(el => {
    el.addEventListener('click', () => {
      const c = state.project.clips.find(x => x.id === state.selectedClipId);
      if (!c) return;
      const prop = el.dataset.kfToggle;
      c.keyframes = c.keyframes || {};
      c.keyframes[prop] = c.keyframes[prop] || [];
      const existing = c.keyframes[prop].findIndex(k => Math.abs(k.time - state.playhead) < 0.05);
      if (existing >= 0) {
        c.keyframes[prop].splice(existing, 1);
        toast('Keyframe removed');
      } else {
        c.keyframes[prop].push({ time: state.playhead, value: c[prop] });
        toast('Keyframe added');
      }
      pushHistory();
      render();
    });
  });

  document.querySelector('[data-reset-filters]')?.addEventListener('click', () => {
    const c = state.project.clips.find(x => x.id === state.selectedClipId);
    if (!c) return;
    updateProject(p => { const cl = p.clips.find(x => x.id === c.id); if (cl) cl.filters = { brightness: 100, contrast: 100, saturation: 100, hue: 0, blur: 0, temp: 0 }; });
    toast('Filters reset');
  });

  document.getElementById('btn-confirm-export')?.addEventListener('click', () => {
    state.modal = null;
    render();
    exportVideo();
  });
}

function attachModalEvents() {
  document.querySelectorAll('[data-close-modal]').forEach(el => {
    el.addEventListener('click', () => { state.modal = null; render(); });
  });
  document.getElementById('btn-confirm-export')?.addEventListener('click', () => {
    state.modal = null;
    render();
    exportVideo();
  });
}

// ---------- PLAYBACK ----------
let playRaf = null;
let lastPlayTime = 0;

function togglePlay() {
  state.isPlaying = !state.isPlaying;
  if (state.isPlaying) {
    initAudio();
    playAudioFrom(state.playhead);
    lastPlayTime = performance.now();
    const tick = () => {
      if (!state.isPlaying) return;
      const now = performance.now();
      const dt = (now - lastPlayTime) / 1000;
      lastPlayTime = now;
      const duration = Math.max(1, state.project.clips.reduce((m, c) => Math.max(m, clipEnd(c)), 0));
      state.playhead += dt;
      if (state.playhead >= duration) {
        state.playhead = 0;
        state.isPlaying = false;
        stopAllAudio();
        render();
        return;
      }
      const canvas = document.getElementById('preview-canvas');
      if (canvas) renderPreview(canvas, false);
      const timeEl = document.querySelector('.font-mono');
      if (timeEl) timeEl.textContent = `${formatTime(state.playhead)} / ${formatTime(duration)}`;
      document.querySelectorAll('.playhead').forEach(ph => {
        ph.style.left = (state.playhead * state.zoom) + 'px';
      });
      playRaf = requestAnimationFrame(tick);
    };
    playRaf = requestAnimationFrame(tick);
  } else {
    cancelAnimationFrame(playRaf);
    stopAllAudio();
  }
  render();
}

render();
